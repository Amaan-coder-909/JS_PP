<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fbff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0, 247, 255, 0.22), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255, 0, 234, 0.2), transparent 34%),
                linear-gradient(135deg, #07080d, #151623 55%, #090a10);
        }

        section {
            width: min(92vw, 430px);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px;

            background: rgba(14, 16, 28, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
        }

        #text {
            width: 100%;
            min-height: 170px;
            padding: 16px 18px;
            resize: vertical;

            color: #ffffff;
            background: rgba(7, 9, 16, 0.92);
            border: 2px solid transparent;
            border-radius: 14px;
            outline: none;

            font: inherit;
            line-height: 1.5;
            caret-color: #00f7ff;

            box-shadow:
                0 0 14px rgba(255, 0, 150, 0.55),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            animation: rgbGlow 4s linear infinite;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #text::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        #text:focus {
            background: rgba(8, 10, 20, 0.98);
            transform: translateY(-2px);
            box-shadow:
                0 0 12px #00f7ff,
                0 0 28px rgba(255, 0, 234, 0.8),
                0 0 46px rgba(0, 255, 102, 0.55),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        h3 {
            padding: 0;
            align-self: flex-end;

            color: #dce8ff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 9px 14px;
        }

        @keyframes rgbGlow {
            0% {
                border-color: #ff004c;
                box-shadow:
                    0 0 14px rgba(255, 0, 76, 0.75),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            25% {
                border-color: #00f7ff;
                box-shadow:
                    0 0 14px rgba(0, 247, 255, 0.75),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            50% {
                border-color: #00ff66;
                box-shadow:
                    0 0 14px rgba(0, 255, 102, 0.75),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            75% {
                border-color: #a600ff;
                box-shadow:
                    0 0 14px rgba(166, 0, 255, 0.75),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            100% {
                border-color: #ff004c;
                box-shadow:
                    0 0 14px rgba(255, 0, 76, 0.75),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }
    </style>
</head>

<body>
    <section>
        <textarea name="" id="text" placeholder="Start typing..."></textarea>
        <h3 id="chars">Characters: </h3>
    </section>

    <script>
        let text = document.querySelector("#text");
        let chars = document.querySelector("#chars");

        text.addEventListener("input", function () {
            chars.textContent = `characters: ${text.value.length}`;
        });
    </script>
</body>

</html>
